services:
  svg-postgres:
    image: postgres:16-alpine
    container_name: svg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: svg_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d svg_manager"]
      interval: 10s
      timeout: 5s
      retries: 5

  svg-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: svg-backend
    restart: unless-stopped
    depends_on:
      svg-postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://svg-postgres:5432/svg_manager
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_ACCESS_TOKEN_EXPIRATION: 3600000
      JWT_REFRESH_TOKEN_EXPIRATION: 604800000
      FILE_STORAGE_PATH: /data/svg
      MAX_FILE_SIZE: 10MB
      MAX_REQUEST_SIZE: 10MB
    volumes:
      - svg-data:/data/svg

volumes:
  postgres-data:
  svg-data:
