spring:
  application:
    name: cutting-admin-test
  datasource:
    url: jdbc:h2:mem:svg_manager_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://mock-keycloak/realms/cutting
          jwk-set-uri: https://mock-keycloak/realms/cutting/protocol/openid-connect/certs
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  file:
    storage-path: target/test-svg-storage
    max-file-size-bytes: 10485760
  keycloak:
    sync-enabled: false
  device:
    # Test cũ không mang sid/thiết bị — tắt kiểm máy; DeviceLimitIntegrationTest bật lại riêng
    enforce: false

logging:
  level:
    root: WARN
    com.example.svgmanager: DEBUG
