# Error Codes
error.SESSION_LIMIT=Tài khoản đã đạt giới hạn số thiết bị hoạt động đồng thời.
error.SESSION_REVOKED=Thiết bị đã bị thu hồi quyền truy cập hoặc phiên đã kết thúc.
error.DEVICE_REQUIRED=Yêu cầu định danh thiết bị hợp lệ.
error.USER_WEB_LOGIN_FORBIDDEN=Tài khoản thợ không có quyền truy cập trang quản trị web.
error.AUTH_SERVICE_UNAVAILABLE=Dịch vụ xác thực tạm thời không khả dụng, vui lòng thử lại sau.
error.USER_ACCOUNT_EXPIRED=Tài khoản của bạn đã hết hạn sử dụng. Vui lòng liên hệ quản trị viên hoặc đại lý.
error.FILE_NOT_FOUND=Không tìm thấy file yêu cầu.
error.NODE_NAME_TAKEN=Tên danh mục hoặc mẫu xe đã tồn tại trong cùng cấp.
error.ONE_VEHICLE_PER_FILE=Mỗi file chỉ được chứa mẫu của một loại xe.
error.UNSUPPORTED_FORMAT=Định dạng file không được hỗ trợ. Chỉ chấp nhận file SVG.
error.SVG_UNITS_MISSING=File SVG thiếu thông số kích thước đơn vị hợp lệ (width/height hoặc viewBox).
error.DESIGN_NOT_FOUND=Không tìm thấy bản thiết kế hoặc bạn không có quyền truy cập.
error.FILE_REQUIRED=Vui lòng cung cấp ít nhất một file (nested hoặc raw).
error.CUT_AREA_INCOMPLETE=Khai báo khổ cắt chưa đầy đủ (cần cả chiều dài và khổ phim).
error.CUT_AREA_OUT_OF_RANGE=Kích thước khổ cắt nằm ngoài giới hạn cho phép (chiều dài 100–50000 mm, khổ phim 100–2000 mm).
error.DESIGN_TOO_LARGE=Bản làm việc vượt quá dung lượng tối đa cho phép (20 MB).
error.DESIGN_INVALID=Dữ liệu bản làm việc không hợp lệ hoặc không đúng định dạng.
error.USER_FILE_NOT_FOUND=Không tìm thấy bản lưu file của người dùng.
error.USER_FILE_SHARE_NOT_FOUND=Không tìm thấy thông tin chia sẻ file.
error.USER_FILE_SHARE_ALREADY_EXISTS=File này đã được chia sẻ cho người dùng trước đó.
error.USER_FILE_SHARE_FORBIDDEN=Bạn không có quyền chia sẻ hoặc truy cập file này.
error.INVALID_SHARE_TARGET=Người nhận chia sẻ không hợp lệ hoặc không tồn tại.
error.CANNOT_SHARE_TO_SELF=Không thể tự chia sẻ file cho chính mình.
error.SVG_SECURITY_VALIDATION_FAILED=File SVG vi phạm chính sách an toàn bảo mật.
error.SVG_SECURITY_REJECTED=File SVG chứa nội dung không an toàn hoặc mã độc.
error.SVG_SIZE_LIMIT_EXCEEDED=File tải lên vượt quá giới hạn dung lượng hoặc độ phức tạp cho phép.
error.SVG_MALWARE_DETECTED=Phát hiện chữ ký không an toàn hoặc cấu trúc độc hại trong file.
error.RATE_LIMIT_EXCEEDED=Bạn đã gửi quá nhiều yêu cầu. Vui lòng thử lại sau giây lát.
error.TOKEN_EXPIRED=Phiên đăng nhập đã hết hạn. Vui lòng làm mới phiên hoặc đăng nhập lại.
error.REFRESH_EXPIRED=Phiên đăng nhập đã kết thúc. Vui lòng đăng nhập lại.
error.BAD_CREDENTIALS=Tên đăng nhập hoặc mật khẩu không chính xác.
error.ACCOUNT_DISABLED=Tài khoản người dùng đã bị vô hiệu hóa. Vui lòng liên hệ quản trị viên.
error.FORBIDDEN=Bạn không có quyền truy cập hoặc thực hiện thao tác này.
error.NOT_FOUND=Không tìm thấy tài nguyên yêu cầu.
error.BAD_REQUEST=Yêu cầu không hợp lệ hoặc tham số không đúng định dạng.
error.UNAUTHORIZED=Bạn chưa đăng nhập hoặc phiên làm việc không hợp lệ.
error.CONFLICT=Dữ liệu bị xung đột hoặc đã tồn tại trong hệ thống.
error.SERVICE_UNAVAILABLE=Dịch vụ phụ thuộc tạm thời không khả dụng, vui lòng thử lại sau.
error.INTERNAL_SERVER_ERROR=Đã xảy ra lỗi hệ thống nội bộ, vui lòng thử lại sau.
error.VALIDATION_ERROR=Dữ liệu gửi lên không vượt qua kiểm tra tính hợp lệ.
error.UNSUPPORTED_MEDIA_TYPE=Định dạng media không được hỗ trợ.
error.FILE_STORAGE_ERROR=Lỗi lưu trữ tập tin trên hệ thống máy chủ.
error.INVALID_SVG=File SVG không hợp lệ hoặc không thể xử lý.
error.PAYLOAD_TOO_LARGE=Dung lượng tải lên vượt quá giới hạn cho phép.

# Messages
msg.password_changed=Đổi mật khẩu thành công.
