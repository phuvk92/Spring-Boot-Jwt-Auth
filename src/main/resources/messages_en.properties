error.BAD_CREDENTIALS=Invalid username or password.
error.ACCOUNT_DISABLED=User account is disabled. Please contact an administrator.
error.FORBIDDEN=Access denied: You do not have permission to perform this action.
error.NOT_FOUND=The requested resource was not found.
error.BAD_REQUEST=Bad request or invalid parameters.
error.UNAUTHORIZED=Unauthorized or session is invalid.
error.CONFLICT=Data conflict or record already exists.
error.SERVICE_UNAVAILABLE=Dependent service is temporarily unavailable. Please try again later.
error.INTERNAL_SERVER_ERROR=An unexpected internal server error occurred.
error.VALIDATION_ERROR=Validation failed for the submitted request.
error.UNSUPPORTED_MEDIA_TYPE=Unsupported media type.
error.FILE_STORAGE_ERROR=File storage error occurred on the server.
error.INVALID_SVG=Invalid or corrupted SVG file.
error.PAYLOAD_TOO_LARGE=Uploaded payload exceeds the maximum allowed limit.

